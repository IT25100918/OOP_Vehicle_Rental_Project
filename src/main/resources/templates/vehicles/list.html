<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Vehicle Inventory — Fleet Manager</title>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>

<nav class="navbar">
  <a class="navbar-brand" th:href="@{/vehicles}">
    🚘 <span>Fleet</span>Manager
  </a>
  <ul class="navbar-links">
    <li><a th:href="@{/vehicles}">Inventory</a></li>
    <li><a th:href="@{/vehicles/add}">Add Vehicle</a></li>
    <li><a th:href="@{/vehicles/search}">Search</a></li>
  </ul>
</nav>

<div class="container">

  <!-- Flash Message -->
  <div class="alert" th:if="${success}">
    ✓ &nbsp;<span th:text="${success}"></span>
  </div>

  <!-- Page Header -->
  <div class="page-header">
    <div class="page-title">
      <small>Vehicle Management</small>
      Fleet Inventory
    </div>
    <a th:href="@{/vehicles/add}" class="btn btn-primary">+ Add Vehicle</a>
  </div>

  <!-- Stats Bar -->
  <div class="stats-bar" th:if="${!vehicles.isEmpty()}">
    <div class="stat-item">
      <div class="stat-value" th:text="${vehicles.size()}">0</div>
      <div class="stat-label">Total Vehicles</div>
    </div>
    <div class="divider"></div>
    <div class="stat-item">
      <div class="stat-value"
           th:text="${vehicles.stream().filter(v -> v.available).count()}">0</div>
      <div class="stat-label">Available</div>
    </div>
    <div class="divider"></div>
    <div class="stat-item">
      <div class="stat-value"
           th:text="${vehicles.stream().filter(v -> v.type == 'CAR').count()}">0</div>
      <div class="stat-label">Cars</div>
    </div>
    <div class="divider"></div>
    <div class="stat-item">
      <div class="stat-value"
           th:text="${vehicles.stream().filter(v -> v.type == 'VAN').count()}">0</div>
      <div class="stat-label">Vans</div>
    </div>
    <div class="divider"></div>
    <div class="stat-item">
      <div class="stat-value"
           th:text="${vehicles.stream().filter(v -> v.type == 'BIKE').count()}">0</div>
      <div class="stat-label">Bikes</div>
    </div>
  </div>

  <!-- Vehicle Grid -->
  <div class="vehicle-grid" th:if="${!vehicles.isEmpty()}">
    <div class="vehicle-card" th:each="v : ${vehicles}">
      <div class="card-type-bar"
           th:classappend="${v.type == 'VAN'} ? 'van' : (${v.type == 'BIKE'} ? 'bike' : '')">
      </div>
      <div class="card-body">
        <div class="card-header-row">
          <div>
            <div class="vehicle-icon"
                 th:text="${v.type == 'CAR'} ? '🚗' : (${v.type == 'VAN'} ? '🚐' : '🏍')"></div>
            <div class="vehicle-name" th:text="${v.brand + ' ' + v.model}"></div>
            <div class="vehicle-year" th:text="${v.year}"></div>
          </div>
          <div>
            <span class="badge badge-type" th:text="${v.type}"></span><br/><br/>
            <span class="badge"
                  th:classappend="${v.available} ? 'badge-available' : 'badge-unavailable'"
                  th:text="${v.available} ? 'Available' : 'Unavailable'"></span>
          </div>
        </div>
        <div class="vehicle-price">
          LKR <th:block th:text="${#numbers.formatDecimal(v.rentalPricePerDay, 1, 'COMMA', 0, 'POINT')}"></th:block>
          <span>/ day</span>
        </div>
        <div class="vehicle-desc" th:text="${v.description}"></div>
        <div class="card-id" th:text="'ID: ' + ${v.id}"></div>
      </div>
      <div class="card-actions">
        <a class="btn btn-secondary btn-sm" th:href="@{'/vehicles/edit/' + ${v.id}}">✏ Edit</a>
        <form th:id="'delete-form-' + ${v.id}"
              th:action="@{'/vehicles/delete/' + ${v.id}}"
              method="post" style="display:inline">
        </form>
        <button class="btn btn-danger btn-sm"
                th:onclick="|confirmDelete('${v.id}', '${v.brand} ${v.model}')|">
          ✕ Remove
        </button>
      </div>
    </div>
  </div>

  <!-- Empty State -->
  <div class="empty-state" th:if="${vehicles.isEmpty()}">
    <div class="icon">🚗</div>
    <h3>No Vehicles Yet</h3>
    <p>Start building your fleet by adding the first vehicle.</p>
    <br/>
    <a th:href="@{/vehicles/add}" class="btn btn-primary">+ Add First Vehicle</a>
  </div>

</div>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
