<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Add Vehicle — Fleet Manager</title>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>

<nav class="navbar">
  <a class="navbar-brand" th:href="@{/vehicles}">
    🚘 <span>Fleet</span>Manager
  </a>
  <ul class="navbar-links">
    <li><a th:href="@{/vehicles}">Inventory</a></li>
    <li><a th:href="@{/vehicles/add}">Add Vehicle</a></li>
    <li><a th:href="@{/vehicles/search}">Search</a></li>
  </ul>
</nav>

<div class="container">
  <div class="page-header">
    <div class="page-title">
      <small>Vehicle Management</small>
      Add New Vehicle
    </div>
    <a th:href="@{/vehicles}" class="btn btn-secondary">← Back to Inventory</a>
  </div>

  <div class="form-card">
    <form th:action="@{/vehicles/add}" method="post">
      <div class="form-grid">

        <!-- Vehicle Type -->
        <div class="form-group full">
          <label class="form-label">Vehicle Type *</label>
          <select name="type" class="form-control" id="typeSelect" required onchange="updateIcon(this.value)">
            <option value="">— Select Type —</option>
            <option value="CAR">🚗 Car</option>
            <option value="VAN">🚐 Van</option>
            <option value="BIKE">🏍 Bike</option>
          </select>
        </div>

        <!-- Brand -->
        <div class="form-group">
          <label class="form-label">Brand / Make *</label>
          <input type="text" name="brand" class="form-control"
                 placeholder="e.g. Toyota, Honda" required/>
        </div>

        <!-- Model -->
        <div class="form-group">
          <label class="form-label">Model *</label>
          <input type="text" name="model" class="form-control"
                 placeholder="e.g. Corolla, Activa" required/>
        </div>

        <!-- Year -->
        <div class="form-group">
          <label class="form-label">Year *</label>
          <input type="number" name="year" class="form-control"
                 placeholder="e.g. 2022" min="1990" max="2030" required/>
        </div>

        <!-- Price -->
        <div class="form-group">
          <label class="form-label">Rental Price / Day (LKR) *</label>
          <input type="number" name="rentalPricePerDay" class="form-control"
                 placeholder="e.g. 5000" min="0" step="0.01" required/>
        </div>

        <!-- Availability -->
        <div class="form-group full">
          <label class="form-label">Availability</label>
          <div class="toggle-group">
            <span class="toggle-label">Mark as Available for Rent</span>
            <label class="toggle">
              <input type="checkbox" name="available" value="true" checked/>
              <div class="toggle-slider"></div>
            </label>
          </div>
        </div>

        <!-- Description -->
        <div class="form-group full">
          <label class="form-label">Description</label>
          <textarea name="description" class="form-control"
                    placeholder="Describe features, condition, special notes..."></textarea>
        </div>

        <!-- Actions -->
        <div class="form-actions">
          <button type="submit" class="btn btn-primary">+ Add Vehicle</button>
          <a th:href="@{/vehicles}" class="btn btn-secondary">Cancel</a>
        </div>

      </div>
    </form>
  </div>
</div>

<script th:src="@{/js/app.js}"></script>
<script>
function updateIcon(type) {
  const icons = { CAR: '🚗', VAN: '🚐', BIKE: '🏍' };
  // Visual feedback only — could update a preview element
}
</script>
</body>
</html>
