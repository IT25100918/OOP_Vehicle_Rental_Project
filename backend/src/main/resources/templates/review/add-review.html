<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Add Review | Prime</title>
    <style>
        :root {
            --primary: #2E9389;
            --primary-dark: #25766e;
            --danger: #ec4335;
            --warning: #FF7A00;
            --bg: #000;
            --card: #121212;
            --card2: #1b1b1b;
            --border: #2c2c2c;
            --text: #fff;
            --muted: #888;
            --radius: .8rem;
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
        a { color: inherit; text-decoration: none; }
        p { color: var(--muted); margin-bottom: 1rem; }
        ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 3px; }

        .header { position: fixed; top: 0; left: 0; right: 0; z-index: 100; background: rgba(0,0,0,0.88); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(255,255,255,0.08); }
        .header-inner { display: flex; justify-content: space-between; align-items: center; height: 70px; padding: 0 1.5rem; max-width: 1200px; margin: 0 auto; }
        .brand { font-size: 1.1rem; font-weight: 700; color: var(--primary); letter-spacing: 0.04em; }
        .header-nav { display: flex; gap: 1.5rem; align-items: center; }
        .header-nav a { font-size: 0.82rem; color: var(--muted); transition: color 0.2s; }
        .header-nav a:hover { color: var(--text); }
        .user-pill { display: flex; align-items: center; gap: 0.6rem; background: var(--card2); border: 1px solid var(--border); border-radius: 2rem; padding: 4px 12px 4px 5px; }
        .user-av { width: 28px; height: 28px; border-radius: 50%; background: var(--primary); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.72rem; color: #fff; }
        .user-name { font-size: 0.78rem; font-weight: 600; }
        .user-role { font-size: 0.58rem; color: var(--primary); text-transform: uppercase; letter-spacing: 0.05em; display: block; }
        .btn-logout { font-size: 0.72rem; color: var(--danger); background: none; border: 1px solid var(--danger); border-radius: 2rem; padding: 3px 10px; cursor: pointer; }

        .main { padding-top: 90px; min-height: 100vh; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 1.5rem; }
        .page-header { padding: 2rem 0 1.5rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; }
        .page-title { font-size: 1.8rem; font-weight: 600; }
        .page-sub { font-size: 0.82rem; color: var(--muted); margin-top: 3px; }

        .btn { display: inline-flex; align-items: center; gap: 0.4rem; padding: 0.5rem 1rem; border-radius: 0.6rem; font-size: 0.82rem; font-weight: 500; cursor: pointer; border: 1px solid transparent; transition: all 0.2s; text-decoration: none; }
        .btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
        .btn-primary:hover { background: var(--primary-dark); }
        .btn-outline { background: transparent; color: var(--primary); border-color: var(--primary); }
        .btn-outline:hover { background: var(--primary); color: #fff; }

        .form-card { background: var(--card); border-radius: var(--radius); padding: 2rem; max-width: 760px; margin: 0 auto; }
        .form-group { margin-bottom: 1.25rem; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        .form-label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 0.45rem; font-weight: 500; }
        .form-label span { color: var(--danger); }
        .form-input { width: 100%; background: var(--card2); border: 1px solid var(--border); border-radius: 0.6rem; padding: 0.65rem 0.9rem; color: var(--text); font-family: inherit; font-size: 0.85rem; outline: none; transition: border-color 0.2s; }
        .form-input:focus { border-color: var(--primary); }
        .form-input::placeholder { color: var(--muted); }
        select.form-input { cursor: pointer; }
        textarea.form-input { resize: vertical; min-height: 100px; }
        .form-actions { display: flex; gap: 0.75rem; margin-top: 1.5rem; }

        footer { background: var(--card); border-top: 1px solid var(--border); padding: 1.5rem; margin-top: 3rem; text-align: center; }
        footer .footer-links { display: flex; gap: 1.5rem; justify-content: center; flex-wrap: wrap; margin-bottom: 0.75rem; }
        footer .footer-links a { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); transition: color 0.2s; }
        footer .footer-links a:hover { color: var(--text); }
        footer .copyright { font-size: 0.7rem; color: var(--muted); }

        @media (max-width: 768px) { .header-nav { display: none; } .form-row { grid-template-columns: 1fr; } }
    </style></head>
<body>
<header class="header"><div class="header-inner">
    <a href="/dashboard" class="brand">Prime Vehicle Rentals</a>
    <nav class="header-nav">
        <a href="/vehicles">Fleet</a>
        <a href="/bookings">Bookings</a>
        <a href="/payments">Payments</a>
        <a href="/reviews">Reviews</a>
        <a href="/users" th:if="${user.role == 'ADMIN' or user.role == 'SUPER_ADMIN'}">Users</a>
        <a href="/admins" th:if="${user.role == 'ADMIN' or user.role == 'SUPER_ADMIN'}">Admins</a>
    </nav>
    <div style="display:flex;align-items:center;gap:0.75rem;">
        <div class="user-pill">
            <div class="user-av" th:text="${#strings.substring(user.fullName,0,1).toUpperCase()}">U</div>
            <div>
                <span class="user-name" th:text="${user.fullName}">Name</span>
                <span class="user-role" th:text="${user.role}">Role</span>
            </div>
        </div>
        <a href="/logout" class="btn-logout">Logout</a>
    </div>
</div></header>

<main class="main"><div class="container">
    <div class="page-header">
        <div><h1 class="page-title">Add Review</h1><p class="page-sub">Share your experience</p></div>
        <a href="/reviews" class="btn btn-outline">&larr; Back</a>
    </div>
    <div class="form-card">
        <!--
          userId is NO LONGER a form field.
          The controller now reads it directly from the session (loggedIn.getUserId()).
          This is the correct and secure approach.
        -->
        <form th:action="@{/reviews/add}" method="post">
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Vehicle <span>*</span></label>
                    <select name="vehicleId" class="form-input" required>
                        <option value="">Select vehicle</option>
                        <option th:each="v : ${vehicles}" th:value="${v.vehicleId}" th:text="${v.brand + ' ' + v.model}">Vehicle</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Rating <span>*</span></label>
                    <select name="rating" class="form-input" required>
                        <option value="5">★★★★★ Excellent</option>
                        <option value="4">★★★★ Good</option>
                        <option value="3">★★★ Average</option>
                        <option value="2">★★ Poor</option>
                        <option value="1">★ Terrible</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label class="form-label">Comment <span>*</span></label>
                <textarea name="comment" class="form-input" placeholder="Share your experience..." required></textarea>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Submit Review</button>
                <a href="/reviews" class="btn btn-outline">Cancel</a>
            </div>
        </form>
    </div>
</div></main>

<footer>
    <div class="footer-links">
        <a href="/dashboard">Dashboard</a>
        <a href="/vehicles">Fleet</a>
        <a href="/bookings">Bookings</a>
        <a href="/payments">Payments</a>
        <a href="/reviews">Reviews</a>
        <a href="/logout">Logout</a>
    </div>
    <div class="copyright">&copy; 2026 PRIME VEHICLE RENTALS. ALL RIGHTS RESERVED.</div>
</footer>
</body></html>
