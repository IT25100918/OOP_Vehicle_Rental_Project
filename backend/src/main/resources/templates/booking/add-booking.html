<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>New Booking | Prime</title><style>
:root{--primary:#2E9389;--primary-dark:#25766e;--danger:#ec4335;--warning:#FF7A00;--bg:#000;--card:#121212;--card2:#1b1b1b;--border:#2c2c2c;--text:#fff;--muted:#888;--radius:.8rem;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
a{color:inherit;text-decoration:none;}p{color:var(--muted);margin-bottom:1rem;}
.header{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(0,0,0,0.88);backdrop-filter:blur(10px);border-bottom:1px solid rgba(255,255,255,0.08);}
.header-inner{display:flex;justify-content:space-between;align-items:center;height:70px;padding:0 1.5rem;max-width:1200px;margin:0 auto;}
.brand{font-size:1.1rem;font-weight:700;color:var(--primary);letter-spacing:0.04em;}
.header-nav{display:flex;gap:1.5rem;align-items:center;}.header-nav a{font-size:0.82rem;color:var(--muted);transition:color 0.2s;}.header-nav a.active,.header-nav a:hover{color:var(--text);}
.user-pill{display:flex;align-items:center;gap:0.6rem;background:var(--card2);border:1px solid var(--border);border-radius:2rem;padding:4px 12px 4px 5px;}
.user-av{width:28px;height:28px;border-radius:50%;background:var(--primary);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:0.72rem;color:#fff;}
.user-name{font-size:0.78rem;font-weight:600;}.user-role{font-size:0.58rem;color:var(--primary);text-transform:uppercase;letter-spacing:0.05em;display:block;}
.btn-logout{font-size:0.72rem;color:var(--danger);background:none;border:1px solid var(--danger);border-radius:2rem;padding:3px 10px;cursor:pointer;}
.main{padding-top:90px;min-height:100vh;}.container{max-width:1200px;margin:0 auto;padding:0 1.5rem;}
.page-header{padding:2rem 0 1.5rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:1rem;}
.page-title{font-size:1.8rem;font-weight:600;}.page-sub{font-size:0.82rem;color:var(--muted);margin-top:3px;}
.panel{background:var(--card);border-radius:var(--radius);overflow:hidden;margin-bottom:1.5rem;}
.panel-hdr{display:flex;justify-content:space-between;align-items:center;padding:1.1rem 1.5rem;border-bottom:1px solid var(--border);}
.panel-hdr h3{font-size:0.95rem;font-weight:600;}.panel-link{color:var(--primary);font-size:0.8rem;}
.filters{display:flex;gap:0.75rem;align-items:center;padding:1rem 1.5rem;border-bottom:1px solid var(--border);flex-wrap:wrap;}
.search-box{display:flex;align-items:center;gap:0.5rem;background:var(--card2);border:1px solid var(--border);border-radius:0.6rem;padding:0.5rem 0.75rem;flex:1;min-width:180px;}
.search-box input{background:none;border:none;outline:none;color:var(--text);font-size:0.82rem;width:100%;}
.search-box input::placeholder{color:var(--muted);}
.btn{display:inline-flex;align-items:center;gap:0.4rem;padding:0.5rem 1rem;border-radius:0.6rem;font-size:0.82rem;font-weight:500;cursor:pointer;border:1px solid transparent;transition:all 0.2s;text-decoration:none;}
.btn-primary{background:var(--primary);color:#fff;border-color:var(--primary);}.btn-primary:hover{background:var(--primary-dark);}
.btn-danger{background:transparent;color:var(--danger);border-color:var(--danger);}.btn-danger:hover{background:var(--danger);color:#fff;}
.btn-warning{background:transparent;color:var(--warning);border-color:var(--warning);}.btn-warning:hover{background:var(--warning);color:#fff;}
.btn-outline{background:transparent;color:var(--primary);border-color:var(--primary);}.btn-outline:hover{background:var(--primary);color:#fff;}
.btn-sm{padding:0.3rem 0.7rem;font-size:0.75rem;}
table{width:100%;border-collapse:collapse;font-size:0.82rem;}
th{padding:0.75rem 1.25rem;text-align:left;color:var(--muted);font-size:0.7rem;text-transform:uppercase;letter-spacing:0.07em;background:rgba(255,255,255,0.01);border-bottom:1px solid var(--border);font-weight:500;}
td{padding:0.85rem 1.25rem;color:var(--text);border-bottom:1px solid var(--border);}
tr:last-child td{border-bottom:none;}tr:hover td{background:rgba(255,255,255,0.02);}td.muted{color:var(--muted);}td.primary{color:var(--primary);font-weight:600;}
.empty-td{text-align:center;color:var(--muted);font-style:italic;padding:3rem!important;}
.pill{display:inline-block;padding:2px 10px;border-radius:.8rem;font-size:0.7rem;font-weight:500;}
.pill-Active,.pill-Available,.pill-Confirmed,.pill-Paid,.pill-Approved{background:rgba(46,147,137,0.15);color:var(--primary);}
.pill-Completed{background:rgba(79,195,247,0.12);color:#4fc3f7;}
.pill-Cancelled,.pill-Inactive,.pill-Overdue{background:rgba(236,67,53,0.12);color:var(--danger);}
.pill-Pending,.pill-Maintenance,.pill-Rented{background:rgba(255,122,0,0.12);color:var(--warning);}
.form-card{background:var(--card);border-radius:var(--radius);padding:2rem;max-width:760px;margin:0 auto;}
.form-group{margin-bottom:1.25rem;}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:1rem;}
.form-label{display:block;font-size:0.8rem;color:var(--muted);margin-bottom:0.45rem;font-weight:500;}
.form-input{width:100%;background:var(--card2);border:1px solid var(--border);border-radius:0.6rem;padding:0.65rem 0.9rem;color:var(--text);font-family:inherit;font-size:0.85rem;outline:none;transition:border-color 0.2s;}
.form-input:focus{border-color:var(--primary);}.form-input::placeholder{color:var(--muted);}
select.form-input{cursor:pointer;}textarea.form-input{resize:vertical;min-height:100px;}
.form-input[readonly]{opacity:0.55;cursor:not-allowed;}
.form-actions{display:flex;gap:0.75rem;margin-top:1.5rem;}
.alert{padding:0.75rem 1rem;border-radius:0.6rem;font-size:0.82rem;margin-bottom:1rem;}
.alert-error{background:rgba(236,67,53,0.1);border:1px solid rgba(236,67,53,0.3);color:var(--danger);}
.alert-success{background:rgba(46,147,137,0.1);border:1px solid rgba(46,147,137,0.3);color:var(--primary);}
.section-title{font-size:1rem;font-weight:600;margin-bottom:1rem;padding-bottom:0.5rem;border-bottom:1px solid var(--border);}
footer{background:var(--card);border-top:1px solid var(--border);padding:1.5rem;margin-top:3rem;text-align:center;}
footer .footer-links{display:flex;gap:1.5rem;justify-content:center;flex-wrap:wrap;margin-bottom:0.75rem;}
footer .footer-links a{font-size:0.72rem;text-transform:uppercase;letter-spacing:0.08em;color:var(--muted);}
footer .copyright{font-size:0.7rem;color:var(--muted);}
@media(max-width:768px){.header-nav{display:none;}.form-row{grid-template-columns:1fr;}}
</style></head><body>
<header class="header"><div class="header-inner">
  <a href="/dashboard" class="brand">Prime Vehicle Rentals</a>
  <nav class="header-nav"><a href="/vehicles">Fleet</a><a href="/bookings">Bookings</a><a href="/payments">Payments</a><a href="/reviews">Reviews</a>
    <a href="/users" th:if="${user != null and (user.role == 'ADMIN' or user.role == 'SUPER_ADMIN')}">Users</a>
    <a href="/admins" th:if="${user != null and (user.role == 'ADMIN' or user.role == 'SUPER_ADMIN')}">Admins</a>
  </nav>
  <div style="display:flex;align-items:center;gap:0.75rem;">
    <div class="user-pill"><div class="user-av" th:text="${user != null and user.fullName != null} ? ${#strings.substring(user.fullName,0,1).toUpperCase()} : 'U'">U</div>
    <div><span class="user-name" th:text="${user != null} ? ${user.fullName} : 'Guest'">G</span><span class="user-role" th:text="${user != null} ? ${user.role} : ''">R</span></div></div>
    <a href="/logout" class="btn-logout">Logout</a>
  </div>
</div></header>
<main class="main"><div class="container">

<div class="page-header"><div><h1 class="page-title">New Booking</h1><p class="page-sub">Reserve a vehicle</p></div></div>
<div class="form-card">
  <div class="alert alert-error" th:if="${error}" th:text="${error}"></div>
  <form action="/bookings/add" method="post">
    <div class="form-group" th:if="${user != null and (user.role == 'ADMIN' or user.role == 'SUPER_ADMIN')}">
      <label class="form-label">Customer <span>*</span></label>
      <select name="userId" class="form-input">
        <option value="" disabled selected>Select customer...</option>
        <option th:each="u : ${users}" th:value="${u.userId}" th:text="${u.fullName + ' (' + u.email + ')'}">-</option>
      </select>
    </div>
    <div class="form-group">
      <label class="form-label">Vehicle <span>*</span></label>
      <select name="vehicleId" class="form-input" required>
        <option value="" disabled selected>Select available vehicle...</option>
        <option th:each="v : ${vehicles}" th:value="${v.vehicleId}" th:text="${v.brand + ' ' + v.model + ' — Rs. ' + v.rentPrice + '/day'}">-</option>
      </select>
    </div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">Start Date <span>*</span></label><input type="date" name="startDate" class="form-input" required></div>
      <div class="form-group"><label class="form-label">End Date <span>*</span></label><input type="date" name="endDate" class="form-input" required></div>
    </div>
    <div class="form-actions"><button type="submit" class="btn btn-primary">Create Booking</button><a href="/bookings" class="btn btn-outline">Cancel</a></div>
  </form>
</div>
</div></main>
<footer><div class="footer-links"><a href="/dashboard">Dashboard</a><a href="/vehicles">Fleet</a><a href="/bookings">Bookings</a><a href="/payments">Payments</a><a href="/reviews">Reviews</a><a href="/logout">Logout</a></div><div class="copyright">&copy; 2026 PRIME VEHICLE RENTALS. ALL RIGHTS RESERVED.</div></footer>
</body></html>
