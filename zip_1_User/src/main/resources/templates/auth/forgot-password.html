<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Cormorant+Garamond:wght@500;600;700&family=Noto+Sans+Sinhala:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Reset Password | Ceylon Rides</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Cormorant+Garamond:wght@500;600;700&display=swap');

    :root {
      --primary:        #c8963e;
      --primary-dark:   #a87830;
      --primary-light:  #f0c060;
      --primary-glow:   rgba(200,150,62,0.2);
      --danger:         #c0392b;
      --warning:        #e67e22;
      --bg:             #080604;
      --bg2:            #0f0b07;
      --card:           #13100a;
      --card2:          #1c1710;
      --border:         #2a2015;
      --border2:        #3d3020;
      --text:           #f0e6d3;
      --text2:          #c9b89a;
      --muted:          #7a6a52;
      --radius:         .8rem;
      --gold:           #c8963e;
      --gold-light:     #f0c060;
      --spice:          #8b3a1a;
      --lotus:          #c0607a;
      --ocean:          #1a6b7a;
      --jungle:         #2d5a3d;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      background-image:
              radial-gradient(ellipse at 0% 0%, rgba(200,150,62,0.04) 0%, transparent 50%),
              radial-gradient(ellipse at 100% 100%, rgba(139,58,26,0.04) 0%, transparent 50%);
    }

    a { color: inherit; text-decoration: none; }
    p { color: var(--text2); margin-bottom: 1rem; }
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: var(--bg2); }
    ::-webkit-scrollbar-thumb { background: linear-gradient(var(--gold), var(--spice)); border-radius: 3px; }

    /* ── HEADER ── */
    .header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      background: rgba(8,6,4,0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border2);
      box-shadow: 0 1px 0 rgba(200,150,62,0.1);
    }
    .header-inner {
      display: flex; justify-content: space-between; align-items: center;
      height: 68px; padding: 0 2rem; max-width: 1280px; margin: 0 auto;
    }
    .header-inner::after {
      content: '';
      position: absolute; bottom: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(to right, transparent, rgba(200,150,62,0.35), transparent);
    }
    .header-inner { position: relative; }

    /* Brand */
    .brand, a.brand {
      display: flex; flex-direction: column; line-height: 1;
      text-decoration: none;
    }
    .brand-name {
      font-family: 'Playfair Display', serif;
      font-size: 1.5rem; font-weight: 900;
      background: linear-gradient(135deg, #c8963e 0%, #f0c060 40%, #e8b84b 70%, #c8963e 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      letter-spacing: 0.03em;
      filter: drop-shadow(0 0 12px rgba(200,150,62,0.3));
    }
    .brand-sub {
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.55rem; font-weight: 600;
      letter-spacing: 0.3em; text-transform: uppercase;
      color: rgba(200,150,62,0.5);
      margin-top: 1px;
    }

    /* Nav */
    .header-nav { display: flex; gap: 2rem; align-items: center; }
    .header-nav a {
      font-size: 0.82rem; color: var(--muted);
      transition: color 0.2s; position: relative; padding-bottom: 2px;
    }
    .header-nav a::after {
      content: ''; position: absolute; bottom: -2px; left: 0; right: 0;
      height: 1px; background: var(--gold); transform: scaleX(0);
      transition: transform 0.2s;
    }
    .header-nav a:hover, .header-nav a.active { color: var(--gold-light); }
    .header-nav a:hover::after, .header-nav a.active::after { transform: scaleX(1); }

    /* User pill */
    .user-pill {
      display: flex; align-items: center; gap: 0.6rem;
      background: var(--card2); border: 1px solid var(--border2);
      border-radius: 2rem; padding: 4px 14px 4px 5px;
    }
    .user-av {
      width: 30px; height: 30px; border-radius: 50%;
      background: linear-gradient(135deg, var(--gold), var(--spice));
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 0.72rem; color: #fff;
    }
    .user-name { font-size: 0.8rem; font-weight: 600; color: var(--text); }
    .user-role { font-size: 0.58rem; color: var(--gold); text-transform: uppercase; letter-spacing: 0.06em; display: block; }
    .btn-logout {
      font-size: 0.72rem; color: var(--danger);
      background: none; border: 1px solid rgba(192,57,43,0.4);
      border-radius: 2rem; padding: 4px 12px; cursor: pointer;
      transition: all 0.2s;
    }
    .btn-logout:hover { background: rgba(192,57,43,0.1); }

    /* ── MAIN ── */
    .main { padding-top: 90px; min-height: 100vh; }
    .container { max-width: 1280px; margin: 0 auto; padding: 0 2rem; }

    /* Page header */
    .page-header {
      padding: 2rem 0 1.5rem;
      display: flex; justify-content: space-between; align-items: flex-start;
      flex-wrap: wrap; gap: 1rem;
      border-bottom: 1px solid var(--border);
      position: relative; margin-bottom: 2rem;
    }
    .page-header::after {
      content: '❖';
      position: absolute; bottom: -0.65rem; left: 50%;
      transform: translateX(-50%);
      color: var(--gold); font-size: 0.65rem;
      background: var(--bg); padding: 0 0.6rem;
    }
    .page-title {
      font-family: 'Playfair Display', serif;
      font-size: 2rem; font-weight: 700; line-height: 1;
      background: linear-gradient(135deg, #c8963e, #f0c060);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .page-sub { font-size: 0.8rem; color: var(--muted); margin-top: 0.4rem; font-family: 'Cormorant Garamond', serif; letter-spacing: 0.05em; }

    /* Stats */
    .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
    .stat-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem 1.5rem;
      position: relative; overflow: hidden;
      transition: border-color 0.2s;
    }
    .stat-card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(to right, var(--gold), var(--spice));
    }
    .stat-card:hover { border-color: var(--border2); }
    .stat-card h4 { font-size: 0.7rem; color: var(--muted); margin-bottom: 0.5rem; font-weight: 400; text-transform: uppercase; letter-spacing: 0.07em; }
    .stat-val { font-size: 2rem; font-weight: 700; color: var(--gold-light); line-height: 1; }

    /* Panel */
    .panel {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); overflow: hidden; margin-bottom: 1.5rem;
    }
    .panel-hdr {
      display: flex; justify-content: space-between; align-items: center;
      padding: 1rem 1.5rem; border-bottom: 1px solid var(--border);
      background: linear-gradient(to right, rgba(200,150,62,0.06), rgba(139,58,26,0.03), transparent);
      position: relative;
    }
    .panel-hdr::after {
      content: ''; position: absolute; bottom: 0; left: 1.5rem; right: 1.5rem; height: 1px;
      background: linear-gradient(to right, rgba(200,150,62,0.3), transparent);
    }
    .panel-hdr h3 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.1rem; font-weight: 700; color: #e8d5b0; margin: 0;
    }
    .panel-hdr h3::before { content: '✦ '; color: var(--gold); font-size: 0.7rem; }
    .panel-link { color: var(--gold); font-size: 0.78rem; transition: color 0.2s; }
    .panel-link:hover { color: var(--gold-light); }

    /* Table */
    table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
    th {
      padding: 0.75rem 1.25rem; text-align: left;
      color: var(--muted); font-size: 0.68rem;
      text-transform: uppercase; letter-spacing: 0.08em;
      background: rgba(200,150,62,0.03);
      border-bottom: 1px solid var(--border); font-weight: 500;
    }
    td { padding: 0.9rem 1.25rem; color: var(--text); border-bottom: 1px solid var(--border); transition: background 0.15s; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(200,150,62,0.04); }
    td.muted { color: var(--muted); font-size: 0.75rem; }
    td.primary { color: var(--gold-light); font-weight: 600; }

    /* Pills */
    .pill { display: inline-block; padding: 3px 12px; border-radius: 2rem; font-size: 0.7rem; font-weight: 600; letter-spacing: 0.02em; }
    .pill-active, .pill-Available    { background: rgba(200,150,62,0.12); color: #f0c060; border: 1px solid rgba(200,150,62,0.25); }
    .pill-Confirmed, .pill-Paid, .pill-Approved { background: rgba(45,90,61,0.2); color: #6ec98a; border: 1px solid rgba(45,90,61,0.3); }
    .pill-Completed  { background: rgba(26,107,122,0.15); color: #5bc4d8; border: 1px solid rgba(26,107,122,0.3); }
    .pill-Cancelled, .pill-Inactive, .pill-Overdue { background: rgba(192,57,43,0.12); color: #e07060; border: 1px solid rgba(192,57,43,0.25); }
    .pill-Pending, .pill-Maintenance, .pill-Rented  { background: rgba(230,126,34,0.12); color: #e8a040; border: 1px solid rgba(230,126,34,0.25); }

    /* Buttons */
    .btn { display: inline-flex; align-items: center; gap: 0.4rem; padding: 0.5rem 1.1rem; border-radius: 0.6rem; font-size: 0.82rem; font-weight: 600; cursor: pointer; border: 1px solid transparent; transition: all 0.2s; text-decoration: none; }
    .btn-primary { background: linear-gradient(135deg, var(--gold), var(--spice)); color: #fff; border-color: transparent; }
    .btn-primary:hover { background: linear-gradient(135deg, var(--gold-light), var(--gold)); transform: translateY(-1px); }
    .btn-danger { background: transparent; color: var(--danger); border-color: rgba(192,57,43,0.4); }
    .btn-danger:hover { background: rgba(192,57,43,0.1); }
    .btn-outline { background: transparent; color: var(--gold); border-color: rgba(200,150,62,0.4); }
    .btn-outline:hover { background: rgba(200,150,62,0.08); color: var(--gold-light); }
    .btn-sm { padding: 0.28rem 0.7rem; font-size: 0.73rem; }

    /* Filters */
    .filters { display: flex; gap: 0.75rem; align-items: center; padding: 1rem 1.5rem; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
    .search-box { display: flex; align-items: center; gap: 0.5rem; background: var(--card2); border: 1px solid var(--border2); border-radius: 0.6rem; padding: 0.5rem 0.85rem; flex: 1; min-width: 180px; transition: border-color 0.2s; }
    .search-box:focus-within { border-color: rgba(200,150,62,0.4); }
    .search-box input { background: none; border: none; outline: none; color: var(--text); font-size: 0.82rem; width: 100%; }
    .search-box input::placeholder { color: var(--muted); }
    select.filter-select { background: var(--card2); border: 1px solid var(--border2); border-radius: 0.6rem; padding: 0.5rem 0.85rem; color: var(--text); font-size: 0.82rem; outline: none; cursor: pointer; }

    /* Forms */
    .form-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 2rem; max-width: 800px; margin: 0 auto; position: relative; }
    .form-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(to right, var(--gold), var(--spice), var(--lotus)); border-radius: var(--radius) var(--radius) 0 0; }
    .form-group { margin-bottom: 1.25rem; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .form-label { display: block; font-size: 0.75rem; color: var(--muted); margin-bottom: 0.45rem; font-weight: 500; text-transform: uppercase; letter-spacing: 0.06em; }
    .form-label span { color: var(--danger); }
    .form-input { width: 100%; background: var(--card2); border: 1px solid var(--border2); border-radius: 0.6rem; padding: 0.7rem 1rem; color: var(--text); font-family: inherit; font-size: 0.88rem; outline: none; transition: border-color 0.2s, box-shadow 0.2s; }
    .form-input:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(200,150,62,0.1); }
    .form-input::placeholder { color: var(--muted); }
    select.form-input { cursor: pointer; }
    textarea.form-input { resize: vertical; min-height: 100px; }
    .form-input[readonly] { opacity: 0.5; cursor: not-allowed; }
    .form-actions { display: flex; gap: 0.75rem; margin-top: 1.75rem; }

    /* Auth */
    .auth-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem; }
    .auth-card { background: var(--card); border-radius: var(--radius); padding: 2.5rem; width: 100%; max-width: 420px; border: 1px solid var(--border2); position: relative; overflow: hidden; }
    .auth-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(to right, var(--gold), var(--spice), var(--lotus)); }
    .auth-logo { text-align: center; margin-bottom: 1.5rem; }
    .auth-logo .logo-name { font-family: 'Playfair Display', serif; font-size: 1.8rem; font-weight: 900; background: linear-gradient(135deg, #c8963e, #f0c060); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .auth-logo .logo-sub { font-family: 'Cormorant Garamond', serif; font-size: 0.7rem; color: var(--muted); letter-spacing: 0.2em; text-transform: uppercase; margin-top: 0.2rem; }
    .auth-title { font-family: 'Playfair Display', serif; font-size: 1.3rem; font-weight: 700; text-align: center; margin-bottom: 0.4rem; color: var(--text); }
    .auth-sub { font-size: 0.82rem; color: var(--muted); text-align: center; margin-bottom: 1.5rem; }
    .alert { padding: 0.75rem 1rem; border-radius: 0.6rem; font-size: 0.82rem; margin-bottom: 1rem; }
    .alert-error { background: rgba(192,57,43,0.1); border: 1px solid rgba(192,57,43,0.3); color: #e07060; }
    .alert-success { background: rgba(200,150,62,0.1); border: 1px solid rgba(200,150,62,0.3); color: var(--gold-light); }
    .auth-footer { text-align: center; font-size: 0.78rem; color: var(--muted); margin-top: 1.25rem; }
    .auth-footer a { color: var(--gold); }

    /* Footer */
    footer { background: var(--card); border-top: 1px solid var(--border); padding: 1.5rem; margin-top: 3rem; text-align: center; }
    footer::before { content: ''; display: block; height: 1px; background: linear-gradient(to right, transparent, var(--gold), var(--spice), var(--gold), transparent); margin-bottom: 1.25rem; }
    footer .footer-links { display: flex; gap: 1.5rem; justify-content: center; flex-wrap: wrap; margin-bottom: 0.75rem; }
    footer .footer-links a { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.09em; color: var(--muted); transition: color 0.2s; }
    footer .footer-links a:hover { color: var(--gold); }
    .copyright { color: var(--muted); font-family: 'Cormorant Garamond', serif; font-size: 0.82rem; letter-spacing: 0.06em; }

    /* Ornament between sections */
    .section-ornament { text-align: center; color: var(--gold); font-size: 0.7rem; margin: 1.5rem 0; letter-spacing: 0.3em; opacity: 0.6; }

  </style></head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo"><span class="logo-name">Ceylon Rides</span></div>
    <h2 class="auth-title">Reset Password</h2>
    <p class="auth-sub">Enter your email and new password</p>
    <div class="alert alert-error" th:if="${error}" th:text="${error}"></div>
    <div class="alert alert-success" th:if="${message}" th:text="${message}"></div>
    <form th:action="@{/forgot-password}" method="post">
      <div class="form-group"><label class="form-label">Email</label><input type="email" name="email" class="form-input" placeholder="your@email.com" required></div>
      <div class="form-group"><label class="form-label">New Password</label><input type="password" name="newPassword" class="form-input" placeholder="••••••••" required></div>
      <div class="form-group"><label class="form-label">Confirm New Password</label><input type="password" name="confirmPassword" class="form-input" placeholder="••••••••" required></div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;padding:0.75rem;">Reset Password</button>
    </form>
    <div class="auth-footer"><a href="/login">&larr; Back to Sign In</a></div>
  </div>
</div>
</body></html>
